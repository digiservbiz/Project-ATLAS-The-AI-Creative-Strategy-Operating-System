name: ATLAS CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
      - name: Fail on typecheck error
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
